title: Singulariteten
email: dustie.kaltman@proton.me
description: Alltid vid nördkulturens händelsehorisont...
lang: sv
baseurl: "/solo" # the subpath of your site, e.g. /blog
url: "https://singulariteten.github.io" # the base hostname & protocol for your site

permalink: /:title:output_ext

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
    input: GFM

plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-paginate

# Pagination
paginate: 10
paginate_path: "/page:num/"

# jekyll-dash (https://github.com/bitbrain/jekyll-dash)
dash:
  # the way how dates should be displayed
  date_format: "%Y-%m-%d"

  # whether the author box should be displayed or not
  show_author: true

  # avatar in the author box: "github" (github_username) or "local" (avatar_path)
  avatar_source: github
  github_username: singulariteten

  # the animation speed of the post description typing effect
  animation_speed: 50

  rtl: false

  # links in the header, e.g.
  # social_links:
  #   - url: https://github.com/singulariteten
  #     icon: github-square
  #     color: purple

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
